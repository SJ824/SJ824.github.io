- year: 2025
  distinction: 1st Place
  title: Hyundai Motor Group's Autonomous Driving Challenge
  prize: '$22,000'
  privilege: Autonomous driving field trip
  organization: Hyundai Motor Group
  context: Team FAST (UNIST)
  description: Developed and implemented robust End-to-End autonomous driving algorithms to win 1st place in the competition.
  project_details:
    overview: Development of a Camera-Only, Deployment-Oriented End-to-End Autonomous Driving Model and the entire pipeline from data collection to closed-loop validation.
    progression:
      - stage: Round 1 Qualifiers
        teams: 16 Teams → 8 Teams
      - stage: Round 1 Main Round
        teams: 8 Teams → 6 Teams
        result: 3rd Place
      - stage: Round 2 Qualifiers
        teams: 6 Teams → 4 Teams
      - stage: FINAL
        teams: 1st Place among 4 Finalists
        result: Winner
    technical:
      - title: Full-Stack E2E Development
        description: Developed an End-to-End autonomous driving model from scratch, covering the entire pipeline from architecture design to implementation.
      - title: Robustness
        description: Applied Imitation Learning and DAgger (Dataset Aggregation) to handle covariate shift and out-of-distribution scenarios.
      - title: Data Pipeline
        description: Collected and refined approximately 24 hours of driving data using multi-view cameras, IMU, and GPS.
      - title: Consistency Enhancement
        description: Developed specialized modules and loss functions to ensure prediction consistency between planning and control heads, addressing a key challenge in End-to-End models.
      - title: Labeling Policy
        description: Established a data labeling policy to enhance closed-loop driving stability.
